[FILES]
# Folder with the LAM:ECHR XMI gold data (the `gold_data` folder from
# https://github.com/trusthlt/mining-legal-arguments). Not shipped for licensing
# reasons: download it (see the README) and extract it here.
gold_data_folder = lam_gold_data

[PREDICTIONS]
# Prediction CSVs scored by 03_evaluate_predictions.py: name = path.
lam_baseline = outputs/paper/predictions/lam_baseline_predictions.csv
flan_t5_xxl = outputs/paper/predictions/predictions-flan-t5-xxl.csv
llama_3.1_8b_v0 = outputs/paper/predictions/predictions-Meta-Llama-3.1-8B-Instruct-v0.csv
llama_3.1_8b_v1 = outputs/paper/predictions/predictions-Meta-Llama-3.1-8B-Instruct-v1.csv
llama_3.1_8b_v2 = outputs/paper/predictions/predictions-Meta-Llama-3.1-8B-Instruct-v2.csv
llama_3.1_8b_v3 = outputs/paper/predictions/predictions-Meta-Llama-3.1-8B-Instruct-v3.csv
llama_3.1_8b_v4 = outputs/paper/predictions/predictions-Meta-Llama-3.1-8B-Instruct-v4.csv
llama_3.1_8b_v6 = outputs/paper/predictions/predictions-Meta-Llama-3.1-8B-Instruct-v6.csv
llama_3.3_70b_v0 = outputs/paper/predictions/predictions-Llama-3.3-70B-Instruct-bnb-4bit-v0.csv
llama_3.3_70b_v1 = outputs/paper/predictions/predictions-Llama-3.3-70B-Instruct-bnb-4bit-v1.csv
llama_3.3_70b_v2 = outputs/paper/predictions/predictions-Llama-3.3-70B-Instruct-bnb-4bit-v2.csv
llama_3.3_70b_v3 = outputs/paper/predictions/predictions-Llama-3.3-70B-Instruct-bnb-4bit-v3.csv
llama_3.3_70b_v4 = outputs/paper/predictions/predictions-Llama-3.3-70B-Instruct-bnb-4bit-v4.csv
llama_3.3_70b_v6 = outputs/paper/predictions/predictions-Llama-3.3-70B-Instruct-bnb-4bit-v6.csv

[PARAMETERS]
seed = 42
# In-text annotation tokens, shared by all scripts (data generation, training, evaluation).
begin_annotation_token = [begin_of_annotation]
end_annotation_token = [end_of_annotation]
end_label_token = [end_of_label]

[cometml]
# Optional experiment logging with Comet ML. Replace with your own credentials
# (or export COMET_API_KEY as an environment variable) and pass --logging.
COMET_API_KEY = "<<REPLACE_WITH_YOUR_COMET_API_KEY>>"
COMET_PROJECT_NAME = "general"
COMET_WORKSPACE = "<<REPLACE_WITH_YOUR_COMET_WORKSPACE>>"
